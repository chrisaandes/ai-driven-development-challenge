apiVersion: apps/v1
kind: Deployment
metadata:
  name: refacil-wallet
  namespace: refacil-wallet
  labels:
    app: refacil-wallet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: refacil-wallet
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: refacil-wallet
    spec:
      terminationGracePeriodSeconds: 30
      # Prefer spreading pods across different nodes for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - refacil-wallet
              topologyKey: kubernetes.io/hostname
      containers:
      - name: refacil-wallet
        # Replace with actual ECR image URI
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/refacil-wallet:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: refacil-wallet-config
        - secretRef:
            name: refacil-wallet-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Liveness probe: is the process alive?
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Readiness probe: is the app ready to serve traffic (DB connected)?
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Graceful shutdown: allow in-flight requests to complete
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
