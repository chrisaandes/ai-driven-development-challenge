apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: refacil-wallet-ingress
  namespace: refacil-wallet
  labels:
    app: refacil-wallet
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # Rate limiting: 100 req/min per IP (complement to app-level throttling)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # Force HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Cache-Control: no-store, no-cache, must-revalidate";
      more_set_headers "Pragma: no-cache";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
spec:
  tls:
  - hosts:
    - api.refacil-wallet.com  # Replace with actual domain
    secretName: refacil-wallet-tls  # Created by cert-manager
  rules:
  - host: api.refacil-wallet.com  # Replace with actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: refacil-wallet
            port:
              number: 80
