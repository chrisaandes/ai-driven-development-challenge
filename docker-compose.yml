services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet_dev
      NODE_ENV: development
      PORT: "3000"
      LOG_LEVEL: debug
      FRAUD_VELOCITY_WINDOW_MINUTES: "5"
      FRAUD_VELOCITY_MAX_TRANSACTIONS: "10"
      FRAUD_AMOUNT_THRESHOLD: "10000"
    volumes:
      # Bind-mount source for hot reload
      - .:/app
      # Anonymous volume prevents host node_modules from overriding container's
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet_dev
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
